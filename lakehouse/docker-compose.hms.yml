services:                                                                                        
  hive-metastore-db:
    image: postgres:16
    environment:
      - POSTGRES_USER=hive
      - POSTGRES_PASSWORD=hive
      - POSTGRES_DB=metastore
    volumes:
      - ./data/hive-metastore-db:/var/lib/postgresql/data
    networks:
      - hudi-datalake
    deploy:
      placement:
        constraints:                                                                             
          - node.role == manager     # pin DB to manager, or use a label
                                                                                                  
  hive-metastore-1:
    image: apachehudi/hive:latest
    ports:
      - "19083:9083"
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-metastore-db:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
    
    configs:                            
      - source: metastore-site.xml
        target: /opt/hive/conf/metastore-site.xml
    networks:
      - hudi-datalake
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.hms == 1

  hive-metastore-2:
    image: apachehudi/hive:latest
    ports:
      - "29083:9083"
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-metastore-db:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
    configs:                            
      - source: metastore-site.xml
        target: /opt/hive/conf/metastore-site.xml
    networks:
      - hudi-datalake
    deploy:                                                                                      
      placement:
        constraints:
          - node.labels.hms == 2

  hive-metastore-3:
    image: apachehudi/hive:latest
    ports:
      - "39083:9083"
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-metastore-db:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
    configs:                            
      - source: metastore-site.xml
        target: /opt/hive/conf/metastore-site.xml
    networks:
      - hudi-datalake
    deploy:
      placement:
        constraints:
          - node.labels.hms == 3

configs:
    metastore-site.xml: # Edit this file need to rm and recreate the stack. If you want to no dowtime, edit the file and rename the config name in docker compose file, then just only redeploy
      file: ./conf/hive/metastore-site.xml

networks:
  hudi-datalake:
    external: true